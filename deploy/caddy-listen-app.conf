# 加进 39.105.73.114 的站点块（SPEC-009 v7 R10、R11）——域名 listening.app.bayescode.com
#（2026-10-26 D53 从 listen-app.bayescode.com 改名，各应用统一挂 app.bayescode.com 下）。
# 那台机器的 Caddy 不是系统服务，是 docker 容器 deploy-caddy-1（带着 TinkerCode 备胎栈），
# Caddyfile 在宿主机 /opt/tinkercode/deploy/Caddyfile（只读挂进容器）。
#
# 动手前先拉回现有配置留底（指南坑⑦：机器上还有 api/admin/bayescourse 的块，别整个覆盖）：
#   ssh root@39.105.73.114 "cp /opt/tinkercode/deploy/Caddyfile /opt/tinkercode/deploy/Caddyfile.backup-<日期>"
# 2026-09-28 部署时追加过旧域名 listen-app.bayescode.com 的块——旧域名从未公开发布，
# 这次把那个旧块整个删掉、换成下面这个（不留跳转，SPEC-009 v7）。然后让容器优雅重载：
#   docker exec deploy-caddy-1 caddy reload --config /etc/caddy/Caddyfile
#
# 反代目标是网桥网关 172.18.0.1（容器里的 127.0.0.1 不是宿主机！网关 IP 用
# docker inspect deploy-caddy-1 查，compose 网络不重建就不变）。serve.py 那头要在
# server-config.json 里加 "bind": "0.0.0.0" 才够得着；对外仍只靠轻量防火墙放行 80/443/22。
# 证书 Caddy 自动签续（R11），DNS 指过来后几分钟内自己签好。
listening.app.bayescode.com {
	encode zstd gzip
	reverse_proxy 172.18.0.1:8790
}
