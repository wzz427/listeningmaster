# 追加到统一部署机（182.92.206.53）宿主机网关配置 /opt/tinkercode/deploy/Caddyfile 文末的站点块
# （SPEC-009 v8 R10、R11）。网关是容器 deploy-caddy-1（这个文件只读挂进去成 /etc/caddy/Caddyfile），
# 证书全自动，新域名首签几十秒。DNS 不用动：*.app.bayescode.com 泛解析已指这台。
#
# 动手前先备份、改完必 validate 再 reload（指南 §6.3）：
#   cp /opt/tinkercode/deploy/Caddyfile /opt/tinkercode/deploy/Caddyfile.bak-$(date +%Y%m%d)-<原因>
#   docker exec deploy-caddy-1 caddy validate --config /etc/caddy/Caddyfile
#   docker exec deploy-caddy-1 caddy reload  --config /etc/caddy/Caddyfile
#
# 没有静态容器、没有 /api 分流：整站过会话门＋音频带账号指路，全走应用容器 listeningapp。
listening.app.bayescode.com {
	encode zstd gzip
	reverse_proxy listeningapp:8790
}
