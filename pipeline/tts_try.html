<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单词朗读试听</title>
<style>
  :root { --ink: #111318; --card: #1b1e26; --line: rgba(255, 240, 215, .12); --cream: #f1e8d8; --muted: #8b857a; --amber: #f2a94e; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 16px 60px; background: var(--ink); color: var(--cream);
         font: 15px/1.6 "Microsoft YaHei UI", "PingFang SC", sans-serif; }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  h2 { font-size: 17px; margin: 34px 0 6px; }
  p.note { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .grid { display: grid; gap: 8px; grid-template-columns: 150px repeat(var(--n), 1fr); align-items: center; overflow-x: auto; }
  .grid .h { color: var(--muted); font-size: 13px; }
  button { font: inherit; color: var(--cream); background: var(--card); border: 1px solid var(--line);
           border-radius: 999px; padding: 7px 12px; cursor: pointer; font-family: Georgia, serif; }
  button:hover { border-color: var(--amber); }
  button.on { background: var(--amber); color: #2a1a06; border-color: var(--amber); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .picked { font-size: 16px; margin-bottom: 12px; }
  .picked b { color: var(--amber); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px 8px; border-top: 1px solid var(--line); }
  .net { color: #ef8b73; } .local { color: #62c1b9; }
</style>
</head>
<body>
<main>
  <h1>单词朗读试听</h1>
  <p class="note">上半部分：百炼语音合成提前生成的声音文件，任何设备都能放，不用联网到境外。下半部分：你这个浏览器自带的朗读，看看它用的是谁的声音。</p>

  <h2>百炼的声音（点一下播放）</h2>
  <div id="bailian" class="grid"></div>

  <h2>这个浏览器自带的朗读（就是播放器里现在的「标准发音」）</h2>
  <div class="box">
    <div id="picked" class="picked">正在读取浏览器里的声音……</div>
    <div id="browserWords"></div>
    <h2 style="margin-top:18px">这个浏览器里所有的英文声音</h2>
    <p class="note">「本机」：装在这台设备里，断网也能读。「联网」：要连到提供它的公司的服务器才读得出来；谷歌的声音在中国大陆不翻墙多半读不出来。</p>
    <table id="voices"></table>
  </div>
</main>
<script>
const DATA = __DATA__;

// 百炼：每个声音一行，每个词一个按钮
const grid = document.getElementById('bailian');
grid.style.setProperty('--n', DATA.words.length);
grid.insertAdjacentHTML('beforeend', '<span class="h">声音</span>' + DATA.words.map((w) => `<span class="h">${w}</span>`).join(''));
let playing = null;
Object.entries(DATA.voices).forEach(([id, name]) => {
  grid.insertAdjacentHTML('beforeend', `<span>${name}</span>`);
  DATA.words.forEach((w) => {
    const b = document.createElement('button');
    b.textContent = w;
    b.onclick = () => {
      if (playing) playing.pause();
      document.querySelectorAll('#bailian button.on').forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      playing = new Audio(`${id}-${w}.mp3`);
      playing.onended = () => b.classList.remove('on');
      playing.play();
    };
    grid.appendChild(b);
  });
});

// 浏览器自带朗读：和播放器 web/app.js 里 speak() 挑声音的规则一样——先挑英音，没有再挑任何英文声音
function pick(voices) {
  return voices.find((v) => v.lang === 'en-GB') || voices.find((v) => v.lang.indexOf('en') === 0);
}
function say(text, voice) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB';
  if (voice) u.voice = voice;
  u.onerror = (e) => { document.getElementById('picked').insertAdjacentHTML('beforeend', `<div class="net">刚才这次没读出来：${e.error}</div>`); };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function showVoices() {
  const voices = speechSynthesis.getVoices().filter((v) => v.lang.indexOf('en') === 0);
  const chosen = pick(voices);
  const where = (v) => (v.localService ? '<span class="local">本机</span>' : '<span class="net">联网</span>');
  document.getElementById('picked').innerHTML = chosen
    ? `播放器会用：<b>${chosen.name}</b>（${chosen.lang}，${where(chosen)}）`
    : '这个浏览器里没有英文声音，播放器的「标准发音」会读不出来';
  const words = document.getElementById('browserWords');
  words.innerHTML = '';
  DATA.words.forEach((w) => {
    const b = document.createElement('button');
    b.textContent = w;
    b.style.marginRight = '8px';
    b.onclick = () => say(w, chosen);
    words.appendChild(b);
  });
  document.getElementById('voices').innerHTML = voices.map((v, i) =>
    `<tr><td>${v.name}</td><td>${v.lang}</td><td>${where(v)}</td><td><button data-i="${i}">试读</button></td></tr>`).join('');
  document.querySelectorAll('#voices button').forEach((b) => { b.onclick = () => say('finished', voices[Number(b.dataset.i)]); });
}
speechSynthesis.onvoiceschanged = showVoices;
showVoices();
</script>
</body>
</html>
